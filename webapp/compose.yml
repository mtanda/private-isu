name: private-isu
services:
  nginx:
    image: nginx:1.30
    depends_on:
      - app
    volumes:
      - ./etc/nginx/conf.d:/etc/nginx/conf.d
      - ./public:/public
    ports:
      - "80:80"
    networks:
      - my_network

  app:
    build:
      # Go実装は golang/ PHP実装は php/ Python実装は python/ Node.js実装は node/ に変更
      context: ruby/
      dockerfile: Dockerfile
    depends_on:
      - mysql
      - memcached
      - alloy
    environment:
      ISUCONP_DB_HOST: mysql
      ISUCONP_DB_PORT: 3306
      ISUCONP_DB_USER: root
      ISUCONP_DB_PASSWORD: root
      ISUCONP_DB_NAME: isuconp
      ISUCONP_MEMCACHED_ADDRESS: memcached:11211
      OTEL_SERVICE_NAME: private-isu-ruby
    networks:
      - my_network
    volumes:
      - ./public:/home/public
    init: true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

  mysql:
    image: mysql:9.7
    environment:
      #- "TZ=Asia/Tokyo"
      - "MYSQL_ROOT_HOST=%"
      - "MYSQL_ROOT_PASSWORD=root"
    volumes:
      - mysql:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    networks:
      - my_network
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

  memcached:
    image: memcached:1.6
    networks:
      - my_network

  mysqld-exporter:
    image: prom/mysqld-exporter
    volumes:
      - ./mysqld_exporter/.my.cnf:/.my.cnf:ro
    command:
      - "--config.my-cnf=/.my.cnf"
      - "--mysqld.address=mysql:3306"
    depends_on:
      - mysql
    networks:
      - my_network

  alloy:
    image: grafana/alloy:latest
    pid: host
    privileged: true
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"
    depends_on:
      - otel-lgtm
      - mysqld-exporter
    networks:
      - my_network

  otel-lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - my_network

  obi:
    image: otel/ebpf-instrument:v0.13.0
    pid: host
    privileged: true
    volumes:
      - ./obi/obi-config.yaml:/config/obi-config.yaml:ro
      - /sys/fs/bpf:/sys/fs/bpf
    command:
      - --config=/config/obi-config.yaml
    depends_on:
      - app
      - alloy
    networks:
      - my_network

  k6:
    image: grafana/k6:2.2.0
    volumes:
      - ./k6:/scripts:ro
      - ../benchmarker/userdata:/userdata:ro
    environment:
      TARGET: http://nginx
      K6_OUT: experimental-prometheus-rw
      K6_PROMETHEUS_RW_SERVER_URL: http://otel-lgtm:9090/api/v1/write
    depends_on:
      - nginx
    networks:
      - my_network

  gcx:
    build:
      context: gcx/
      dockerfile: Dockerfile
    environment:
      GRAFANA_SERVER: http://otel-lgtm:3000
      GRAFANA_USER: admin
      GRAFANA_PASSWORD: admin
      GRAFANA_ORG_ID: 1
    volumes:
      - gcx-config:/root/.config/gcx
    depends_on:
      - otel-lgtm
    networks:
      - my_network

volumes:
  mysql:
  gcx-config:

networks:
  my_network:
